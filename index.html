<style>
:root{--teal:#0F766E;--teal-l:#F0FDFA;--orange:#C2410C;--orange-l:#FFF7ED;--ink:#1F2937;--grey:#4B5563;--line:#D1D5DB;--acc:#0F766E}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:#F8FAFC}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
header{background:var(--acc);color:#fff;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:background .3s}
header h1{margin:0;font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:1px}
.topline{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500;gap:8px;flex-wrap:wrap}
.score{background:#fff;color:var(--acc);font-weight:900;border-radius:99px;padding:4px 14px;font-size:16px}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:#FDBA74;width:0;transition:width .4s}
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mission{text-align:left;background:#fff;border:2px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-family:inherit;color:var(--ink);min-height:84px}
.mission:hover{transform:translateY(-2px)}
.mission b{font-size:18px;color:var(--c)}
.mission .ag{font-size:13px;color:var(--grey)}
.mission .st{font-size:20px;color:#F59E0B;letter-spacing:3px}
.card{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.kicker{font-size:13px;font-weight:700;color:var(--orange);letter-spacing:1px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.combo{color:var(--acc)}
.q{font-size:clamp(18px,4.6vw,22px);font-weight:700;line-height:1.5;margin:0}
.tag{font-size:13px;font-weight:700;color:var(--acc)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
button{font-family:inherit}
.opt{min-height:52px;font-size:17px;font-weight:500;text-align:left;padding:12px 16px;border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;color:var(--ink)}
.opts.two .opt{text-align:center}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.right{background:#CCFBF1;border-color:var(--teal);font-weight:700}
.opt.wrong{background:#FFEDD5;border-color:var(--orange);text-decoration:line-through}
.step{display:flex;align-items:center;gap:10px}
.step .n{width:30px;height:30px;border-radius:99px;border:2px dashed var(--grey);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.opt.picked .n{background:var(--acc);border:2px solid var(--acc);color:#fff}
.fb{border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.6;display:none}
.fb.show{display:block;animation:pop .25s}
.fb.good{background:var(--teal-l);border:2px solid var(--teal)}
.fb.bad{background:var(--orange-l);border:2px solid var(--orange)}
.fb b{display:block;font-size:17px;margin-bottom:2px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 24px;font-size:17px;font-weight:700;cursor:pointer;min-height:48px}
.btn.ghost{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.btn.orange{background:var(--orange)}
.hidden{display:none!important}
.svgbox{display:flex;justify-content:center}.svgbox svg{max-width:100%;height:auto}
.end{text-align:center;align-items:center}
.badge{width:140px;height:140px;border-radius:99px;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border:8px solid #FDBA74;font-weight:900}
.badge span:first-child{font-size:40px}
.stars{font-size:36px;letter-spacing:6px;color:#F59E0B}
.hint{font-size:14px;color:var(--grey);line-height:1.5}
footer{font-size:12px;color:var(--grey);text-align:center}
</style>

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===q.a;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');award(ok);
    fb(ok,(ok?'':'正確答案：'+q.o[q.a]+'。')+(q.e?q.e+'。':''));
  });
}
function renderOrder(q){
  const seq=[];
  app.innerHTML=`<section class="card">${head()}<p class="q">${esc(q.q)}</p><div class="hint">按正確次序逐一點選。</div>
  <div class="opts">${q.shuffle.map(k=>`<button class="opt step" data-k="${k}"><span class="n"></span><span>${esc(q.steps[k])}</span></button>`).join('')}</div>
  <div class="row" id="ctl"><button class="btn ghost" id="rs">重設</button><button class="btn orange" id="ok">確定</button></div>
  <div class="fb" id="fb"></div><div class="row"><button class="btn hidden" id="nx">下一題</button></div></section>`;
  const btns=[...app.querySelectorAll('.step')];
  btns.forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(seq.includes(k))return;seq.push(k);b.classList.add('picked');b.querySelector('.n').textContent=seq.length});
  document.getElementById('rs').onclick=()=>{seq.length=0;btns.forEach(b=>{b.classList.remove('picked');b.querySelector('.n').textContent=''})};
  document.getElementById('ok').onclick=()=>{
    if(seq.length<q.steps.length)return;
    const ok=seq.every((k,i)=>k===i);
    btns.forEach(b=>{b.disabled=true;const k=+b.dataset.k;b.querySelector('.n').textContent=k+1;b.classList.add(seq.indexOf(k)===k?'right':'wrong')});
    document.getElementById('ctl').classList.add('hidden');award(ok);
    fb(ok,ok?'次序完全正確！':'圓圈內已顯示正確次序：'+q.steps.join(' → '));
  };
}
function next(){qi++;if(qi>=list.length)return finish();render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(){
  const pct=right/list.length,st=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  best[M.id]=Math.max(best[M.id]||0,st);
  const t=['見習特工','初級特工','高級特工','王牌特工'][st];
  document.getElementById('prog').style.width='100%';
  app.innerHTML=`<section class="card end"><div class="kicker" style="justify-content:center"><span>${esc(M.name)} 任務完成</span></div>
  <div class="badge" aria-hidden="true"><span>${'★'.repeat(Math.max(st,1))}</span><span style="font-size:18px">${t}</span></div>
  <p class="q">答對 ${right} / ${list.length} 題 · ${score} 分</p>
  <div class="stars" aria-label="${st} 粒星">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <div class="hint">截圖交給老師。再玩一次會抽到不同的題目。</div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="again">再玩一次</button><button class="btn" id="home">選擇其他特工</button></div></section>`;
  document.getElementById('again').onclick=()=>start(M);document.getElementById('home').onclick=menu;
}
menu();
</script>
